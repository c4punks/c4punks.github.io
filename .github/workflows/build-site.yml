# Rebuild the static site from site/ and commit the result.
#
# The published HTML is generated by CWIST, so it must never be edited by hand.
# This workflow is what proves that: it builds the CWIST WASI 0.2 archive, links
# the site application against it, runs the exporter under wasmtime, and commits
# whatever changed.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

env:
  WASI_SDK_VERSION: '25.0'
  WASMTIME_VERSION: 'v25.0.2'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out CWIST
        uses: actions/checkout@v4
        with:
          repository: c4punks/CWIST
          path: cwist
          submodules: recursive

      - name: Record the CWIST revision
        id: cwist
        run: echo "sha=$(git -C cwist rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Downloads land in the runner temp directory, never in the workspace,
      # so they cannot be picked up by the commit step below.
      - name: Install the WASI SDK
        run: |
          curl -sSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          mkdir -p "$HOME/toolchains"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$HOME/toolchains"
          echo "WASI_SDK=$HOME/toolchains/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" >> "$GITHUB_ENV"

      - name: Install wasmtime
        run: |
          curl -sSL -o "$RUNNER_TEMP/wasmtime.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          mkdir -p "$HOME/toolchains"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$HOME/toolchains"
          echo "WASMTIME=$HOME/toolchains/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" >> "$GITHUB_ENV"

      # The archive only changes when CWIST does, and building it from a cold
      # checkout is the slowest step here by a wide margin.
      - name: Restore the cached CWIST WASI archive
        id: archive-cache
        uses: actions/cache@v4
        with:
          path: |
            cwist/libcwist_wasip2_wasm32-wasip2.a
            cwist/.wasip2-build
          key: cwist-wasip2-${{ steps.cwist.outputs.sha }}-sdk${{ env.WASI_SDK_VERSION }}

      - name: Build the CWIST WASI archive
        if: steps.archive-cache.outputs.cache-hit != 'true'
        run: make -C cwist libcwist_wasip2_wasm32-wasip2.a WASI_SDK="$WASI_SDK" -j"$(nproc)"

      - name: Build the site application
        run: make -C site CWIST_ROOT="$GITHUB_WORKSPACE/cwist" WASI_SDK="$WASI_SDK"

      - name: Export the static site
        run: make -C site export CWIST_ROOT="$GITHUB_WORKSPACE/cwist" WASI_SDK="$WASI_SDK" WASMTIME="$WASMTIME"

      - name: Fail if the export produced nothing
        run: test -s index.html && test -s sitemap.xml

      - name: Commit the regenerated site
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage only what the exporter writes. Anything else in the
          # workspace belongs to the runner, not to the site.
          git add -A -- index.html 404.html robots.txt sitemap.xml .nojekyll \
                        about contribute guides projects assets
          if git diff --cached --quiet; then
            echo 'The export matches what is committed; nothing to do.'
            exit 0
          fi
          git commit -m 'Rebuild the static site from site/ [skip ci]'
          git push
